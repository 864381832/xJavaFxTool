dependencies {
    api project(':xcore')
    implementation 'org.apache.commons:commons-email:1.5'
}

group = 'com.xwintop'
version = '0.0.2'
description = 'x-EmailTool'

//打jar包需要包含依赖的配置
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.compileClasspath.findAll { it.name.contains("commons-email")
    || it.name.contains("javax.mail")
    }.collect { zipTree(it) } }
}