dependencies {
    api project(':xcore')
    implementation 'org.apache.sshd:sshd-sftp:2.15.0'
}

group = 'com.xwintop'
version = '0.0.1'
description = 'x-SftpServer'

//打jar包需要包含依赖的配置
jar {
    from { configurations.compileClasspath.findAll { it.name.contains("sshd-sftp") }.collect { zipTree(it) } }
}